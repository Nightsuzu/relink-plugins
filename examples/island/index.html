<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relink 灵动岛</title><link rel="stylesheet" href="island.css"></head>
<body><main id="island" class="island">
  <button id="summary" class="summary" aria-expanded="false" aria-controls="details" aria-label="展开 Relink 灵动岛">
    <svg class="brand" width="26" height="32" viewBox="0 0 26 32" aria-hidden="true"><path d="M9 5 3 18M17 5 7 27M23 16 18 27" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="text"><strong id="room">Relink</strong><span id="status">准备连接</span></span><span id="signal" class="signal" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <section id="details" hidden aria-label="通话控制">
    <div class="detail-header"><span id="count">尚未加入通话</span><button id="collapse" class="icon" aria-label="收起"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></div>
    <div class="controls">
      <button id="mute" aria-label="麦克风静音" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/><path class="slash" d="m3 3 18 18"/></svg><span>静音</span></button>
      <button id="deafen" aria-label="拒听" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="4" height="9" rx="2"/><rect x="17" y="12" width="4" height="9" rx="2"/><path class="slash" d="m3 3 18 18"/></svg><span>拒听</span></button>
      <button id="show" aria-label="返回 Relink"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M8 22h8M12 18v4"/></svg><span>返回</span></button>
    </div><p id="notice" role="status"></p>
  </section>
</main><script src="island.js"></script></body></html>
