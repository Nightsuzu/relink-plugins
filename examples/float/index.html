<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relink 浮岛</title><link rel="stylesheet" href="float.css"><link rel="stylesheet" href="media.css"><script defer src="float.js"></script><script defer src="media.js"></script></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v3m-4 0h8"/></symbol>
<symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></symbol>
<symbol id="i-return" viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6m-6-6h12a5 5 0 0 1 5 5"/></symbol>
<symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4m-3-11 3-3 3 3m-3-3v7"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
</defs></svg>
<main id="island" aria-label="Relink 通话浮岛">
  <span class="orbit-ring" aria-hidden="true"><i></i></span>
  <div id="header">
    <button id="summary" aria-expanded="false" aria-controls="details" aria-label="展开通话控制">
      <img id="compact-cover" alt="" hidden><img id="player-icon" alt="" hidden><span class="brand" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="copy"><strong id="room">Relink</strong><span id="status">正在同步通话</span><progress id="compact-progress" max="1" value="0" aria-label="歌曲播放进度" hidden></progress></span>
      <svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <button id="quick-mute" class="quick" aria-label="麦克风静音" aria-pressed="false" disabled><svg aria-hidden="true"><use href="#i-mic"/></svg><span class="slash" aria-hidden="true"></span></button>
  </div>
  <section id="details" aria-label="通话控制" aria-hidden="true" inert>
    <nav id="views" aria-label="浮岛视图"><span id="auto-context">自动识别</span><button data-view="voice" aria-pressed="true">通话控制</button><button data-view="channels" aria-pressed="false">切换频道</button></nav>
    <div id="view-voice" class="view">
    <div class="context"><span id="count">尚未加入通话</span><span id="share" hidden><svg aria-hidden="true"><use href="#i-screen"/></svg>共享中</span><button id="collapse" aria-label="收起通话控制"><svg aria-hidden="true"><use href="#i-chevron"/></svg></button></div>
    <div class="controls">
      <button id="mute" aria-pressed="false" disabled><span class="control-icon"><svg aria-hidden="true"><use href="#i-mic"/></svg><span class="slash" aria-hidden="true"></span></span><span id="mute-label">麦克风</span></button>
      <button id="deafen" aria-pressed="false" disabled><span class="control-icon"><svg aria-hidden="true"><use href="#i-headphones"/></svg><span class="slash" aria-hidden="true"></span></span><span id="deafen-label">耳机</span></button>
      <button id="show"><span class="control-icon"><svg aria-hidden="true"><use href="#i-return"/></svg></span><span>返回通话</span></button>
    </div>
    <div class="notch-setting"><label for="notch-opacity">游戏刘海透明度 <output id="notch-opacity-value">15%</output></label><input id="notch-opacity" type="range" min="0" max="85" step="5" value="15" aria-label="游戏刘海透明度"></div>
    <div class="footer"><span id="mode">通话随身，桌面留白</span><span><kbd>Esc</kbd> 收起</span></div>
    </div>
    <div id="view-music" class="view" hidden>
      <div id="players" aria-label="当前播放器"></div>
      <div id="music-content" hidden>
        <div class="track"><div class="art"><img id="cover" alt="歌曲封面"><span id="no-cover" aria-hidden="true">♫</span></div><div class="metadata"><strong id="track-title"></strong><span id="track-artist"></span></div></div>
        <div id="lyric" aria-label="当前歌词"><span id="lyric-now"></span><span id="lyric-next"></span></div>
        <div class="timeline"><span id="elapsed">0:00</span><progress id="progress" max="1" value="0" aria-label="歌曲播放进度"></progress><span id="duration">0:00</span></div>
        <div class="transport" aria-label="播放控制">
          <button id="previous" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5 8 12l11 7Z"/></svg></button>
          <button id="play-pause" aria-label="播放"><svg viewBox="0 0 24 24"><path id="play-path" d="m9 5 11 7-11 7Z"/></svg></button>
          <button id="next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button>
          <button id="light" aria-label="关闭环绕光效" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg></button>
        </div>
      </div>
      <div id="music-empty" class="empty"><span class="empty-icon">♫</span><strong>让音乐靠近一点</strong><span>播放 QQ 音乐、网易云音乐或汽水音乐<br>支持系统媒体控制的曲目会出现在这里</span></div>
    </div>
    <div id="view-channels" class="view" hidden><p class="channel-heading">当前 Room · 语音频道</p><div id="channels" aria-label="语音频道列表"></div><p id="channel-empty" class="empty">登录 Relink 并打开一个 Room</p></div>
    <p id="notice" role="status" aria-live="polite"></p>
  </section>
</main>
</body></html>
